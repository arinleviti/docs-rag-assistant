server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular uses client-side routing, so any path that doesn't match a
    # real file should fall back to index.html and let Angular's router
    # handle it, rather than nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}